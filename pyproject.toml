[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zmorph"
version = "0.1.0"
description = "Z-interpolation of multi-label EM segmentations onto an isotropic grid, with conforming cell meshes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy", "scipy", "scikit-image", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["zmorph"]
